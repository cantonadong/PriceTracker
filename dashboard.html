<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>价格跟踪</title><link rel="stylesheet" href="dashboard.css"></head><body>
<div class="shell"><header class="topbar"><div class="brand"><img class="logo" src="icon.png" alt="价格跟踪"><div><strong>价格跟踪</strong><small>跟踪商品价格，买到更好的价格</small></div></div></header><main>
<section class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索已跟踪的商品..."></label></section>
<section class="table-card"><div class="table-head"><span aria-hidden="true"></span><span>商品</span><span>当前价格</span><span>目标价格</span><span>操作</span></div><div id="list" class="list"></div><section id="empty" class="empty" hidden><span>◇</span><h2>还没有跟踪商品</h2><p>打开商品页面，通过扩展菜单添加价格跟踪。</p><button id="empty-add" class="primary">了解如何添加</button></section></section>
<footer><span id="subtitle">共 0 个商品</span><span>上次更新：<b id="updated">—</b><button id="refresh" class="link">↻ 全部刷新</button></span></footer></main></div>
<div id="modal" class="modal" hidden><div class="backdrop"></div><form id="edit-form" class="dialog"><header><h2>编辑商品</h2><button type="button" class="close" aria-label="关闭">×</button></header><div class="product-preview"><span id="preview-icon" class="product-icon">P</span><div><strong id="preview-title"></strong><small id="preview-domain"></small><a id="preview-link" target="_blank">打开商品页面 ↗</a></div></div><label>商品标题<input id="edit-title" required></label><label>商品链接<input id="edit-url" type="url" required></label><label>当前价格<input id="edit-current" readonly></label><label>目标价格<input id="edit-target" type="number" min="0" step="0.01" required></label><label class="notify-row"><span><b>达到阈值时通知我</b><small>当商品价格 ≤ 目标价格时，在浏览器中显示通知。</small></span><input id="edit-notify" type="checkbox" role="switch" checked></label><div class="dialog-actions"><button id="modal-delete" type="button" class="danger">删除</button><span></span><button type="button" class="secondary close">取消</button><button class="primary">保存</button></div></form></div><div id="toast" class="toast" hidden></div><script src="dashboard.js"></script></body></html>
